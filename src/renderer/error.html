<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Page not available</title>
<style>
  :root { --accent: #6c63ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f13; color: #c9c9d8;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; padding: 2rem; text-align: center;
  }
  .icon { font-size: 4rem; margin-bottom: 1.5rem; }
  h1 { color: #fff; font-size: 1.6rem; margin-bottom: .5rem; }
  p { font-size: .95rem; opacity: .7; max-width: 480px; margin-bottom: 1.5rem; }
  code { background: rgba(255,255,255,.08); padding: .2em .5em; border-radius: 4px; font-size: .85rem; word-break: break-all; }
  .btn {
    display: inline-block; margin-top: 1.5rem; padding: .7rem 1.8rem;
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    font-size: .95rem; cursor: pointer; transition: opacity .2s;
  }
  .btn:hover { opacity: .85; }
</style>
</head>
<body>
<div class="icon">⚡</div>
<h1>Page not available</h1>
<p id="msg">The page could not be loaded.</p>
<code id="url"></code>
<button class="btn" onclick="history.back()">Go Back</button>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById('msg').textContent =
    `Error ${p.get('code') || ''}: ${p.get('desc') || 'Could not reach the page.'}`;
  const u = p.get('url');
  if (u) document.getElementById('url').textContent = u;
</script>
</body>
</html>
