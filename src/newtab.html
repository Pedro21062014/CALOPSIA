<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova aba — CALOPSIA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
      background: radial-gradient(1200px 700px at 50% -10%, #1b2030 0%, #0e1016 60%);
      color: #e8ebf2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .logo {
      width: 84px; height: 84px;
      margin-bottom: 26px;
      filter: drop-shadow(0 10px 30px rgba(124, 92, 255, 0.35));
    }

    .clock {
      font-size: 58px;
      font-weight: 300;
      letter-spacing: 2px;
      line-height: 1;
    }
    .date {
      margin-top: 8px;
      font-size: 15px;
      color: #8b93a5;
      text-transform: capitalize;
    }
    .greeting {
      margin-top: 26px;
      font-size: 20px;
      font-weight: 500;
    }

    .search {
      margin-top: 30px;
      width: min(560px, 92%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid #2b3142;
      border-radius: 28px;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .search:focus-within {
      border-color: #7c5cff;
      box-shadow: 0 0 0 4px rgba(124,92,255,0.18);
      background: rgba(255,255,255,0.07);
    }
    .search svg { flex-shrink: 0; opacity: 0.65; }
    .search input {
      flex: 1;
      border: none; outline: none;
      background: transparent;
      color: #e8ebf2;
      font-size: 15px;
    }
    .search input::placeholder { color: #8b93a5; }

    .quick {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(4, 92px);
      gap: 14px;
    }
    .quick a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #aeb5c6;
      font-size: 12px;
      transition: transform .12s ease, color .12s ease;
    }
    .quick a:hover { transform: translateY(-3px); color: #fff; }
    .quick .tile {
      width: 54px; height: 54px;
      border-radius: 15px;
      display: grid; place-items: center;
      font-size: 22px; font-weight: 700;
      color: #fff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .tile.google { background: linear-gradient(135deg,#4285f4,#34a853 60%,#fbbc05); }
    .tile.youtube { background: linear-gradient(135deg,#ff0000,#cc0000); }
    .tile.github { background: linear-gradient(135deg,#333,#111); }
    .tile.wiki { background: linear-gradient(135deg,#636363,#3a3a3a); }
    .tile.gmail { background: linear-gradient(135deg,#ea4335,#b31412); }
    .tile.x { background: linear-gradient(135deg,#1d1d1f,#000); }
    .tile.netflix { background: linear-gradient(135deg,#b9090b,#7a0505); }
    .tile.maps { background: linear-gradient(135deg,#1a73e8,#0d47a1); }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
    <defs>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7c5cff"/>
        <stop offset="1" stop-color="#3ec6ff"/>
      </linearGradient>
    </defs>
    <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#lg)"/>
    <text x="24" y="33" font-family="Segoe UI, system-ui, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  </svg>

  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>
  <div class="greeting" id="greeting"></div>

  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e8ebf2" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
    </svg>
    <input id="q" type="text" placeholder="Pesquisar no Google" autocomplete="off" />
  </div>

  <div class="quick">
    <a href="https://www.google.com"><span class="tile google">G</span>Google</a>
    <a href="https://www.youtube.com"><span class="tile youtube">▶</span>YouTube</a>
    <a href="https://github.com"><span class="tile github">GH</span>GitHub</a>
    <a href="https://pt.wikipedia.org"><span class="tile wiki">W</span>Wikipedia</a>
    <a href="https://mail.google.com"><span class="tile gmail">M</span>Gmail</a>
    <a href="https://x.com"><span class="tile x">𝕏</span>X</a>
    <a href="https://www.netflix.com"><span class="tile netflix">N</span>Netflix</a>
    <a href="https://maps.google.com"><span class="tile maps">⌖</span>Maps</a>
  </div>

  <script>
    const SEARCH_URL = 'https://www.google.com/search?q=';

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const now = new Date();
      document.getElementById('clock').textContent =
        pad(now.getHours()) + ':' + pad(now.getMinutes());
      document.getElementById('date').textContent =
        now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

      const h = now.getHours();
      const g = h < 6 ? 'Boa madrugada' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
      document.getElementById('greeting').textContent = g + ' 👋';
    }
    tick();
    setInterval(tick, 1000);

    function doSearch() {
      const q = document.getElementById('q').value.trim();
      if (q) window.location.href = SEARCH_URL + encodeURIComponent(q);
    }
    document.getElementById('q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doSearch();
    });
  </script>
</body>
</html>
