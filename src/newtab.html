<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova aba</title>
  <link rel="icon" id="favicon" href="../assets/logo.png" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="newtab.css" />
  <link rel="stylesheet" href="polish.css" />
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <main class="stage">
    <header class="brand">
      <img class="logo" id="logo" src="../assets/logo.png" alt="CALOPSIA" draggable="false" />
      <span class="wordmark">CALOPSIA</span>
    </header>

    <div class="clock">
      <span id="hh">--</span><span class="blink">:</span><span id="mm">--</span><span id="ss" class="sec">--</span>
    </div>
    <div class="date" id="date">—</div>
    <div class="greeting" id="greeting">Olá 👋</div>

    <form class="search" id="search-form" autocomplete="off">
      <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.2" y2="16.2"></line>
      </svg>
      <input id="q" type="text" placeholder="Pesquise no Google ou digite um endereço" autocomplete="off" spellcheck="false" />
      <button type="submit" class="s-go" title="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="12" x2="19" y2="12"></line>
          <polyline points="13 6 19 12 13 18"></polyline>
        </svg>
      </button>
    </form>

    <nav class="quick" id="quick"></nav>

    <footer class="hint">
      <span><kbd>Ctrl</kbd>+<kbd>T</kbd> nova aba</span>
      <span><kbd>Ctrl</kbd>+<kbd>L</kbd> barra de endereço</span>
      <span><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>T</kbd> reabrir aba</span>
    </footer>
  </main>

  <script src="theme-boot.js"></script>
  <script src="logo-data.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
