<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Calopsia">
  <defs>
    <linearGradient id="g-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="55%" stop-color="#f7b32b"/>
      <stop offset="100%" stop-color="#ff7a45"/>
    </linearGradient>
    <linearGradient id="g-crest" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#f7b32b"/>
      <stop offset="100%" stop-color="#ffe29a"/>
    </linearGradient>
    <radialGradient id="g-ring" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#2b2b34"/>
      <stop offset="100%" stop-color="#17171b"/>
    </radialGradient>
  </defs>

  <!-- disco de fundo -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#g-ring)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="57.5" fill="none" stroke="rgba(255,255,255,.09)"/>

  <!-- crista -->
  <path d="M126 44c14-16 34-19 46-9-9 3-14 9-16 17 13-8 27-6 34 3-11 0-19 5-24 13-4 6-8 11-13 15z"
        fill="url(#g-crest)"/>

  <!-- cabeça / corpo estilizado -->
  <path d="M158 78c26 10 42 34 42 62 0 38-30 68-70 68-24 0-45-12-57-31l30-16c7 9 17 14 27 14 20 0 36-16 36-35 0-16-11-30-26-34-6-2-10-7-10-13 0-9 9-17 17-15z"
        fill="url(#g-body)"/>

  <!-- bochecha -->
  <circle cx="112" cy="120" r="17" fill="#ff7a45" opacity=".92"/>
  <circle cx="112" cy="120" r="17" fill="none" stroke="rgba(0,0,0,.12)"/>

  <!-- olho -->
  <circle cx="150" cy="104" r="9" fill="#17171b"/>
  <circle cx="153" cy="101" r="3" fill="#fff" opacity=".85"/>

  <!-- bico -->
  <path d="M92 108c-11 2-18 9-18 17s7 14 17 14c-6-4-9-9-9-15s4-12 10-16z" fill="#efefef"/>
</svg>
