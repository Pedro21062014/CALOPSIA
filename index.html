<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CALOPSIA Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="browser-window">
    <div class="titlebar">
      <div class="logo">CALOPSIA</div>
    </div>
    
    <div class="toolbar">
      <div class="nav-buttons">
        <button id="btn-back" title="Back">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
        </button>
        <button id="btn-forward" title="Forward">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
        </button>
        <button id="btn-reload" title="Reload">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button id="btn-home" title="Home">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>
      </div>
      
      <div class="address-bar-container">
        <input type="text" id="address-bar" placeholder="Enter URL or search...">
      </div>
    </div>
    
    <div class="tabs-container">
      <div class="tabs-header">
        <div id="tabs" class="tabs-list"></div>
        <button id="btn-new-tab" class="new-tab-btn" title="New Tab">+</button>
      </div>
      <div id="tab-views" class="tab-views"></div>
    </div>
  </div>
  
  <script src="renderer.js"></script>
</body>
</html>
