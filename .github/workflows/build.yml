name: 🏗️ Build & Release Calopsia

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  build-mac:
    name: 🍎 macOS (x64 + arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calopsia-mac
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  build-win:
    name: 🪟 Windows (x64 + ia32 + arm64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calopsia-win
          path: |
            dist/*.exe
            dist/*.msi
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  build-linux:
    name: 🐧 Linux (x64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            rpm fakeroot dpkg libnss3-dev libgconf-2-4 \
            libxss1 libxtst6 libxrandr2 libasound2

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calopsia-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  release:
    name: 🚀 Publish Release
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Collect release files
        run: |
          mkdir release-files
          find dist-artifacts -type f \( \
            -name "*.dmg" -o -name "*.zip" -o \
            -name "*.exe" -o -name "*.msi" -o \
            -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \
          \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Calopsia ${{ github.ref_name }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: false
          generate_release_notes: true
          files: release-files/*
          body: |
            ## 🌊 Calopsia ${{ github.ref_name }}

            A fast, modern, Chromium-based browser built with Electron.

            ### 📦 Downloads
            | Platform | File |
            |---|---|
            | 🍎 macOS (Apple Silicon) | `*-arm64.dmg` |
            | 🍎 macOS (Intel) | `*-x64.dmg` |
            | 🪟 Windows (x64) | `*-Setup.exe` |
            | 🪟 Windows (x86) | `*-ia32-Setup.exe` |
            | 🐧 Linux | `*.AppImage` / `*.deb` / `*.rpm` |
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
