name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.6.0). Vazio = usa a versao do package.json'
        required: false
        default: ''
      prerelease:
        description: 'Marcar como pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1) Compila os instaladores nos 3 sistemas (e 2 arquiteturas no mac)
  #    - Linux : AppImage + deb
  #    - macOS : dmg + zip  (x64 e arm64/Apple Silicon)
  #    - Win   : NSIS (instalador) + portable
  # ------------------------------------------------------------------
  build:
    name: Compilar ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            args: --linux
            exts: AppImage deb
          - os: macos-latest
            name: macOS
            args: --mac --x64 --arm64
            exts: dmg zip
          - os: windows-latest
            name: Windows
            args: --win
            exts: exe
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # nao assina no macOS (evita falha sem certificado)
      USE_HARD_LINKS: "false"
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache do Electron
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: electron-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar icones
        run: npm run icons

      - name: Verificar sintaxe (lint rapido)
        shell: bash
        run: |
          for f in main.js preload.js preload-menu.js preload-popup.js webview-preload.js \
                   src/renderer.js src/newtab.js src/about.js src/updater.js src/tabs.js \
                   src/menu.js src/popup.js src/senhas.js src/cofre.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Mostrar versao
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "CALOPSIA versao ${VERSION}"
          echo "## CALOPSIA ${VERSION} — ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar com electron-builder
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Listar artefatos gerados
        shell: bash
        run: ls -lh release/ || true

      - name: Gerar checksums SHA-256
        shell: bash
        run: |
          cd release
          case "${{ matrix.name }}" in
            Linux)   pat="*.AppImage *.deb" ;;
            macOS)   pat="*.dmg *.zip" ;;
            Windows) pat="*.exe" ;;
          esac
          shopt -s nullglob
          sha256sum $pat > "SHA256SUMS-${{ matrix.name }}.txt" 2>/dev/null || true
          cat "SHA256SUMS-${{ matrix.name }}.txt" || true
          echo "### Checksums ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "SHA256SUMS-${{ matrix.name }}.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: calopsia-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.exe
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # 2) Junta tudo e publica a Release com os instaladores anexados
  # ------------------------------------------------------------------
  release:
    name: Publicar Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descobrir a tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag definida: ${TAG}"

      - name: Baixar instaladores
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Consolidar checksums
        shell: bash
        run: |
          cd assets
          cat SHA256SUMS-*.txt 2>/dev/null | sort -u > ALL-CHECKSUMS.txt || true
          rm -f SHA256SUMS-*.txt
          echo "Checksums consolidados:"
          cat ALL-CHECKSUMS.txt || true

      - name: Criar Release e anexar os instaladores
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: CALOPSIA ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            assets/*.dmg
            assets/*.zip
            assets/*.AppImage
            assets/*.deb
            assets/*.exe
            assets/ALL-CHECKSUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumo
        shell: bash
        run: |
          echo "### Release ${{ steps.meta.outputs.tag }} publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Arquivos anexados:" >> "$GITHUB_STEP_SUMMARY"
          for f in assets/*.dmg assets/*.zip assets/*.AppImage assets/*.deb assets/*.exe assets/ALL-CHECKSUMS.txt; do
            [ -e "$f" ] || continue
            size=$(ls -lh "$f" | awk '{print $5}')
            echo "- \`${f##*/}\` — ${size}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Plataformas: Linux (AppImage/deb), macOS (dmg/zip x64+arm64), Windows (NSIS + portable)" >> "$GITHUB_STEP_SUMMARY"
