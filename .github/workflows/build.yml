name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.2.0). Vazio = usa a versão do package.json'
        required: false
        default: ''
      prerelease:
        description: 'Marcar como pré-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1) Compila os instaladores nos 3 sistemas (e 2 arquiteturas no mac)
  # ------------------------------------------------------------------
  build:
    name: Compilar ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            args: --linux
            exts: AppImage deb
          - os: macos-latest
            name: macOS
            args: --mac --x64 --arm64
            exts: dmg zip
          - os: windows-latest
            name: Windows
            args: --win
            exts: exe
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # não assina no macOS (evita falha sem certificado)
      USE_HARD_LINKS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir ícones
        shell: bash
        run: |
          faltou=0
          for f in assets/icon-1024.png assets/icon.ico \
                   assets/icons/16x16.png assets/icons/32x32.png \
                   assets/icons/64x64.png assets/icons/128x128.png \
                   assets/icons/256x256.png assets/icons/512x512.png; do
            if [ ! -f "$f" ]; then echo "::error::Ícone ausente: $f"; faltou=1; fi
          done
          if [ "$faltou" = "1" ]; then
            echo "Rode 'npm run icons' e versione o resultado."
            exit 1
          fi
          echo "Ícones OK"

      - name: Mostrar versão
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "CALOPSIA versão ${VERSION}"

      - name: Compilar com electron-builder
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

      - name: Listar artefatos gerados
        shell: bash
        run: ls -lh release/ || true

      - name: Gerar checksums (SHA-256)
        shell: bash
        run: |
          cd release
          for ext in ${{ join(matrix.exts, ' ') }}; do
            for f in *."$ext"; do
              [ -e "$f" ] || continue
              if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f"
              else shasum -a 256 "$f"; fi
            done
          done > "SHA256SUMS-${{ matrix.name }}.txt" || true
          cat "SHA256SUMS-${{ matrix.name }}.txt" || true

      - name: Enviar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: CALOPSIA-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------
  # 2) Junta tudo e publica a Release com os instaladores anexados
  # ------------------------------------------------------------------
  release:
    name: Publicar Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descobrir a tag
        id: meta
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag definida: ${TAG}"

      - name: Baixar instaladores
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Consolidar checksums
        run: |
          cd assets
          cat SHA256SUMS-*.txt 2>/dev/null | sort -u > ALL-CHECKSUMS.txt || true
          rm -f SHA256SUMS-*.txt
          cat ALL-CHECKSUMS.txt || true

      - name: Criar Release e anexar os instaladores
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: CALOPSIA ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            assets/*.dmg
            assets/*.zip
            assets/*.AppImage
            assets/*.deb
            assets/*.exe
            assets/ALL-CHECKSUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumo
        run: |
          echo "### 🚀 Release ${{ steps.meta.outputs.tag }} publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Arquivos anexados:" >> "$GITHUB_STEP_SUMMARY"
          for f in assets/*.dmg assets/*.zip assets/*.AppImage assets/*.deb assets/*.exe; do
            [ -e "$f" ] || continue
            echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          done
