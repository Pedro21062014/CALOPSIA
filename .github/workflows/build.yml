name: 🔨 Build Calopsia

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

# Evita runs duplicados em PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 🍎  macOS  –  DMG (x64 + arm64)
  # ──────────────────────────────────────────────────────────
  build-mac:
    name: 🍎 macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build macOS (.dmg x64 + arm64)
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List dist/
        run: ls -lh dist/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calopsia-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # 🐧  Linux  –  AppImage + deb
  # ──────────────────────────────────────────────────────────
  build-linux:
    name: 🐧 Linux AppImage + deb
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            xvfb \
            libgbm-dev \
            libasound2-dev \
            rpm \
            dpkg

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Build Linux (.AppImage + .deb)
        run: npm run build:linux
        env:
          USE_HARD_LINKS: false

      - name: List dist/
        run: ls -lh dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calopsia-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # 🪟  Windows  –  NSIS installer + portable
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: 🪟 Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Windows (.exe NSIS + portable)
        run: npm run build:win

      - name: List dist/
        shell: pwsh
        run: Get-ChildItem dist/ | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: calopsia-windows
          path: |
            dist/*.exe
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # 📋  Summary
  # ──────────────────────────────────────────────────────────
  summary:
    name: 📋 Build Summary
    runs-on: ubuntu-latest
    needs: [build-mac, build-linux, build-windows]
    if: always()
    steps:
      - name: Result
        run: |
          echo "## 🦋 Calopsia Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 macOS | ${{ needs.build-mac.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Linux | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🪟 Windows | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
